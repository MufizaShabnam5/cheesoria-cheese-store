<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Cheesoria Artisanal Cheese Store</title>
  <meta name="description" content="Sign in to your Cheesoria account to access your artisanal cheese orders, store settings, and member privileges.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <!-- Ambient Luxury Glow Orbs (Background Ambiance) -->
  <div class="auth-ambient-glow">
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>
  </div>

  <!-- Main Centered Authentication Container -->
  <div class="auth-container">
    <main class="auth-card glass-card">

      <!-- Top-Right Controls: Dark Mode Toggle & LTR/RTL Toggle -->
      <div class="auth-top-controls">
        <button id="auth-theme-toggle" class="auth-control-btn" title="Toggle Light / Dark Theme" type="button">
          <span class="theme-icon-sun">☀️</span>
          <span class="theme-icon-moon">🌙</span>
        </button>
        <button id="auth-rtl-toggle" class="auth-control-btn" title="Toggle Layout Direction (LTR / RTL)" type="button">
          <span class="rtl-text">RTL</span>
        </button>
      </div>

      <!-- Card Header with Centered Cheesoria Logo -->
      <div class="auth-header">
        <a href="index.html" class="auth-logo-link" title="Cheesoria Home">
          <span class="logo-emoji">🧀</span>
          <div class="logo-text-group">
            <span class="logo-name">Cheesoria</span>
            <span class="logo-subtitle">Cheese Store</span>
          </div>
        </a>
        <h1 class="auth-title">Welcome    Back</h1>
      </div>

      <!-- Interactive Alert Message Box -->
      <div id="auth-alert-box" class="auth-alert hidden" role="alert"></div>

      <!-- Vertically Stacked Authentication Form -->
      <form id="login-form" class="auth-form" action="#" method="POST" novalidate>

        <!-- Field 1: Email Address / Username -->
        <div class="form-field">
          <label for="email" class="form-label">
            <span>Email Address</span>
          </label>
          <div class="input-rel-wrap">
            <span class="input-field-icon">✉️</span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="auth-input" 
              placeholder="e.g. jeanluc@cheesoria.com" 
              required
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Field 2: Password with Eye Toggle -->
        <div class="form-field">
          <label for="password" class="form-label">
            <span>Password</span>
          </label>
          <div class="input-rel-wrap">
            <span class="input-field-icon">🔒</span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="auth-input" 
              placeholder="Enter your password" 
              required
              autocomplete="current-password"
            >
            <button 
              type="button" 
              class="eye-toggle-btn" 
              data-target="password" 
              title="Toggle password visibility" 
              aria-label="Toggle password visibility"
            >
              <span class="eye-icon">👁️</span>
            </button>
          </div>
        </div>

        <!-- Same Row Options: Remember Me & Forgot Password -->
        <div class="form-options-row">
          <label class="checkbox-label">
            <input type="checkbox" class="custom-checkbox" name="remember" checked>
            <span>Remember Me</span>
          </label>
          <a href="#" class="forgot-pass-link" title="Recover forgotten password">Forgot Password?</a>
        </div>

        <!-- Full-Width CTA Submit Button (Matches Input Width) -->
        <button type="submit" class="auth-submit-btn">
          <span>Sign In to Cheesoria</span>
          <span>✨</span>
        </button>
      </form>

      <!-- Social Login Buttons Section (Positioned Below Sign In Button) -->
      <div class="social-divider">
        <span>or continue with social account</span>
      </div>

      <div class="social-buttons-grid">
        <button class="social-btn" type="button" title="Sign in with Google" aria-label="Sign in with Google">
          <svg class="social-icon-svg" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </button>

        <button class="social-btn" type="button" title="Sign in with Apple" aria-label="Sign in with Apple">
          <svg class="social-icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.67-.82 1.13-1.96.99-3.1-.98.04-2.17.65-2.86 1.46-.61.71-1.15 1.87-.99 2.98 1.09.08 2.2-.52 2.86-1.34z"/>
          </svg>
        </button>

        <button class="social-btn" type="button" title="Sign in with Facebook" aria-label="Sign in with Facebook">
          <svg class="social-icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </button>
      </div>

      <!-- Card Footer: Switch to Sign Up Page -->
      <div class="auth-footer">
        <span>Don't have an account?</span>
        <a href="signup.html" class="auth-switch-link" title="Create a new Cheesoria account">Sign Up</a>
      </div>

    </main>
  </div>

  <!-- Authentication JavaScript -->
  <script src="js/auth.js"></script>
</body>
</html>
